name: Сборка APK и программы для Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Установить Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Собрать APK
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk raspisanie-widget.apk

      # Черновик выпуска: станет «последним» только когда соберётся и версия для Windows
      - name: Создать черновик выпуска
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v3.0.${{ github.run_number }}" raspisanie-widget.apk \
            --title "Расписание, версия 3.0.${{ github.run_number }}" \
            --notes "Телефон (Android): raspisanie-widget.apk. Компьютер (Windows): raspisanie-setup.exe." \
            --draft

  desktop:
    name: Windows
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5

      - name: Установить зависимости
        run: npm ci --no-audit --no-fund

      - name: Тесты
        run: npm test

      - name: Собрать установщик
        run: |
          # номер версии = номер сборки: по нему программа понимает, что вышло обновление
          npm version "3.0.${{ github.run_number }}" --no-git-tag-version --allow-same-version
          npm run dist

      - name: Самопроверка программы
        run: |
          exe=$(ls dist/win-unpacked/*.exe | head -1)
          echo "Запускаю: $exe"
          code=0
          RASPISANIE_SMOKE=1 RASPISANIE_SMOKE_REPORT="$PWD/smoke.json" timeout 120 "$exe" || code=$?
          cat smoke.json || true
          exit $code

      - name: Добавить в выпуск и опубликовать
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # latest.yml и .blockmap нужны программе для автообновления
          gh release upload "v3.0.${{ github.run_number }}" \
            dist/raspisanie-setup.exe dist/raspisanie-setup.exe.blockmap dist/latest.yml --clobber
          gh release edit "v3.0.${{ github.run_number }}" --draft=false --latest
