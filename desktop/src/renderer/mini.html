<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Моё расписание</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="theme.css">
  <script src="theme.js"></script>
  <style>
    html, body { background: transparent; overflow: hidden; user-select: none; }
    /* Как новый Android-виджет: светлый/тёмный фон, карточка «Сейчас», строки с точками и метками */
    .widget {
      margin: 6px;
      padding: 12px 14px 10px;
      border-radius: 22px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      box-shadow: 0 4px 14px rgba(20, 10, 30, .22);
      -webkit-app-region: drag;
    }
    .top { display: flex; align-items: center; gap: 10px; }
    .clock { font-size: 32px; font-weight: 500; line-height: 1; letter-spacing: -.5px; font-variant-numeric: tabular-nums; }
    .day { font-weight: 600; font-size: 14px; }
    .date { color: var(--muted); font-size: 12px; }
    .tools { margin-left: auto; display: flex; gap: 4px; align-self: flex-start; -webkit-app-region: no-drag; }
    .tools button {
      background: var(--surface); border: none; color: var(--muted); width: 26px; height: 26px;
      padding: 0; border-radius: 8px; font-size: 13px; line-height: 26px;
    }
    .tools button:hover { background: var(--primary-soft); color: var(--primary); }
    .status {
      margin-top: 10px; padding: 8px 12px 10px; border-radius: 16px; background: var(--hero); color: #fff;
    }
    .status .main { font-weight: 600; font-size: 15px; }
    .status .count { color: var(--accent); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .status .sub { color: var(--hero-sub); font-size: 12px; }
    .status .sub { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .title {
      margin: 10px 0 2px; color: var(--muted); font-size: 10px; font-weight: 500;
      text-transform: uppercase; letter-spacing: .8px;
    }
    .lesson {
      display: flex; align-items: center; gap: 8px; padding: 3px 8px; border-radius: 10px; font-size: 12px;
      cursor: pointer; -webkit-app-region: no-drag;
    }
    .lesson::before {
      content: ''; width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--muted); opacity: .6;
    }
    .lesson:hover { background: var(--surface); }
    .lesson .t { width: 84px; flex: none; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .lesson .n { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lesson.past .n { color: var(--muted); text-decoration: line-through; }
    .lesson.past::before { opacity: .35; }
    .lesson.current { background: var(--primary-soft); }
    .lesson.current .t, .lesson.current .n { color: var(--primary); font-weight: 600; }
    .lesson.current::before { background: var(--accent); opacity: 1; }
    .lesson.next .t { color: var(--text); }
    .lesson.next .n { font-weight: 600; }
    .lesson.next::before { background: transparent; border: 2px solid var(--accent); width: 5px; height: 5px; opacity: 1; }
    .lesson.current::after, .lesson.next::after {
      flex: none; font-size: 10px; font-weight: 500; padding: 1px 6px; border-radius: 6px;
    }
    .lesson.current::after { content: 'идёт'; background: var(--accent); color: var(--on-accent); }
    .lesson.next::after { content: 'далее'; background: var(--orange-soft); color: var(--orange); }
    .hint { color: var(--muted); font-size: 10px; margin-top: 6px; }
    .hint.update { color: var(--primary); font-weight: 600; cursor: pointer; -webkit-app-region: no-drag; }
  </style>
</head>
<body>
  <div class="widget" id="w">
    <div class="top">
      <div class="clock" id="clock">--:--</div>
      <div>
        <div class="day" id="day"></div>
        <div class="date" id="date"></div>
      </div>
      <div class="tools">
        <button id="open" title="Открыть расписание">☰</button>
        <button id="hide" title="Скрыть (вернуть — значок в трее)">—</button>
      </div>
    </div>
    <div class="status">
      <div class="main" id="status"></div>
      <div class="count" id="count"></div>
      <div class="sub" id="sub"></div>
    </div>
    <div class="title" id="listTitle"></div>
    <div id="list"></div>
    <div class="hint" id="hint">Нажмите на урок, чтобы задать домашку</div>
  </div>
  <script src="../shared/logic.js"></script>
  <script src="mini.js"></script>
</body>
</html>
