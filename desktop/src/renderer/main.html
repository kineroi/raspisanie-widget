<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Моё расписание</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="theme.css">
  <style>
    body { overflow: hidden; }
    .app { display: flex; height: 100vh; }

    /* Боковая панель */
    .side {
      width: 88px; flex: none; background: var(--surface);
      display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 24px 0;
    }
    .logo {
      width: 40px; height: 40px; border-radius: 12px; margin-bottom: 8px;
      background: var(--primary); color: var(--on-primary);
      display: grid; place-items: center; font-weight: 600; font-size: 14px;
    }
    .nav {
      width: 56px; height: 56px; padding: 0; border: 0; border-radius: 12px;
      background: transparent; color: var(--muted); display: grid; place-items: center;
    }
    .nav:hover { background: var(--primary-soft); color: var(--primary); }
    .nav.active, .nav.active:hover { background: var(--primary); color: var(--on-primary); }
    .nav:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    /* Раздел «Неделя»: только расписание на всю ширину */
    .week-only .today-head, .week-only .tiles, .week-only .col-right { display: none; }
    .nav:disabled { opacity: .35; }
    .nav svg, .icon-btn svg { width: 24px; height: 24px; }

    /* Шапка */
    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .top {
      display: flex; align-items: center; gap: 16px; padding: 20px 32px;
      border-bottom: 1px solid var(--border);
    }
    .top h1 { font-size: 24px; font-weight: 400; margin: 0; color: var(--text); }
    .top .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .icon-btn {
      width: 40px; height: 40px; padding: 0; border: 0; border-radius: 12px;
      background: var(--surface); color: var(--text); display: grid; place-items: center;
    }
    .icon-btn svg { width: 20px; height: 20px; }
    .scroll { flex: 1; overflow-y: auto; }
    .banner {
      margin: 16px 32px 0; padding: 10px 14px; border-radius: 8px;
      background: var(--primary-soft); color: var(--text); display: flex; gap: 12px; align-items: center;
    }
    .banner span { flex: 1; }

    /* Содержимое главной */
    .content { display: flex; gap: 32px; padding: 24px 32px 32px; align-items: flex-start; }
    .col-left { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
    .col-right { width: 402px; flex: none; display: flex; flex-direction: column; gap: 16px; }
    @media (max-width: 1080px) {
      .content { flex-direction: column; }
      .col-right { width: 100%; }
    }
    h2 { font-size: 20px; font-weight: 500; margin: 0; color: var(--text); }
    .card { background: var(--surface); border-radius: 8px; }

    .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
    @media (max-width: 760px) { .tiles { grid-template-columns: 1fr 1fr; } }
    .tile {
      display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 14px 16px; border: 0;
      border-radius: 8px; text-align: left; min-width: 0;
    }
    .tile svg { width: 22px; height: 22px; flex: none; }
    .tile b, .tile small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tile b { font-size: 16px; font-weight: 600; }
    .tile small { font-size: 12px; }
    .tile > span { min-width: 0; width: 100%; }
    .tile.blue { background: var(--blue-soft); color: var(--blue); }
    .tile.red { background: var(--red-soft); color: var(--red); }
    .tile.orange { background: var(--orange-soft); color: var(--orange); }
    .tile.green { background: var(--green-soft); color: var(--green); }
    .tile:hover { filter: brightness(.97); }
    .tile:disabled { opacity: .5; }

    .week { padding: 20px 24px; display: flex; flex-direction: column; gap: 12px; }
    .week-head { display: flex; align-items: center; gap: 8px; }
    .week-head .range { font-size: 13px; font-weight: 500; }
    .arrow { width: 28px; height: 28px; padding: 0; border: 0; background: transparent; color: var(--text); display: grid; place-items: center; }
    .arrow svg { width: 20px; height: 20px; }
    .arrow:disabled { opacity: .3; }
    .day + .day { margin-top: 12px; }
    .day h3 { margin: 0 0 2px; font-size: 14px; font-weight: 600; color: var(--muted); }
    .day.today h3 { color: var(--primary); }
    .day .empty { color: var(--muted); font-size: 14px; padding: 4px 12px; }
    .lesson {
      display: flex; align-items: center; gap: 16px; padding: 8px 12px; border-radius: 8px; cursor: pointer;
    }
    .lesson:hover { background: var(--bg); }
    .lesson .time { width: 96px; flex: none; font-size: 14px; font-weight: 500; color: var(--muted); }
    .lesson .body { flex: 1; min-width: 0; }
    .lesson .name { font-size: 15px; font-weight: 500; }
    .lesson .det { font-size: 13px; color: var(--muted); white-space: pre-line; margin-top: 2px; }
    .lesson .nohw { font-size: 13px; color: var(--red); margin-top: 2px; }
    .lesson.past .name { color: var(--muted); }
    .lesson.current { background: var(--primary-soft); }
    .lesson.current .time, .lesson.current .name { color: var(--primary); font-weight: 600; }
    .lesson.next .name { font-weight: 600; }
    .chip { flex: none; font-size: 12px; font-weight: 500; padding: 3px 8px; border-radius: 6px; }
    .chip.now { background: var(--accent); color: var(--on-accent); }
    .chip.next { background: var(--orange-soft); color: var(--orange); }

    /* Правая колонка */
    .bc { display: flex; align-items: center; gap: 12px; padding: 16px 20px 16px 16px; }
    .bc .mark {
      width: 48px; height: 48px; border-radius: 8px; flex: none; background: var(--blue); color: #fff;
      display: grid; place-items: center; font-size: 20px; font-weight: 600;
    }
    .bc .info { flex: 1; min-width: 0; }
    .bc .info b { display: block; font-size: 16px; font-weight: 500; }
    .bc .info small { display: block; font-size: 12px; color: var(--muted); }
    .bc .info small.error { color: var(--red); }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .stat {
      display: flex; flex-direction: column; gap: 4px; padding: 20px 16px 20px 20px; border: 0; border-radius: 8px;
      background: var(--surface); text-align: left; color: var(--text);
    }
    .stat:hover { background: var(--surface); filter: brightness(.98); }
    .stat .ic { width: 48px; height: 48px; border-radius: 8px; color: #fff; display: grid; place-items: center; margin-bottom: 12px; }
    .stat .ic svg { width: 24px; height: 24px; }
    .stat b { font-size: 18px; font-weight: 600; }
    .stat span { font-size: 14px; font-weight: 500; }
    .stat small { font-size: 12px; color: var(--muted); }

    /* Настройки */
    .settings { flex-direction: column; align-items: stretch; }
    .settings .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
    .settings .card { padding: 20px; }
    .settings h3 { font-size: 16px; font-weight: 500; margin: 0 0 8px; }
    .settings .row { margin-top: 10px; }
    .toggles label { display: flex; gap: 8px; align-items: center; margin-top: 8px; cursor: pointer; }
    .ai-ok { color: var(--text); }
  </style>
</head>
<body>
  <div class="app">
    <nav class="side" aria-label="Разделы">
      <div class="logo" aria-hidden="true">МР</div>
      <button class="nav active" id="navHome" title="Главная">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 8.27V4.23C22 2.64 21.36 2 19.77 2H15.73C14.14 2 13.5 2.64 13.5 4.23V8.27C13.5 9.86 14.14 10.5 15.73 10.5H19.77C21.36 10.5 22 9.86 22 8.27Z"/><path d="M10.5 8.52V3.98C10.5 2.57 9.86 2 8.27 2H4.23C2.64 2 2 2.57 2 3.98V8.51C2 9.93 2.64 10.49 4.23 10.49H8.27C9.86 10.5 10.5 9.93 10.5 8.52Z"/><path d="M10.5 19.77V15.73C10.5 14.14 9.86 13.5 8.27 13.5H4.23C2.64 13.5 2 14.14 2 15.73V19.77C2 21.36 2.64 22 4.23 22H8.27C9.86 22 10.5 21.36 10.5 19.77Z"/><path d="M15 15.5H21M15 19.5H21"/></svg>
      </button>
      <button class="nav" id="navWeek" title="Неделя">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2V5M16 2V5M3.5 9.09H20.5"/><path d="M21 8.5V17C21 20 19.5 22 16 22H8C4.5 22 3 20 3 17V8.5C3 5.5 4.5 3.5 8 3.5H16C19.5 3.5 21 5.5 21 8.5Z"/><path stroke-width="2" d="M15.69 13.7H15.7M15.69 16.7H15.7M11.99 13.7H12M11.99 16.7H12M8.29 13.7H8.3M8.29 16.7H8.3"/></svg>
      </button>
      <button class="nav" id="openGrades" title="Успеваемость">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.05 2.53L4.03 6.46C2.1 7.72 2.1 10.54 4.03 11.8L10.05 15.73C11.13 16.44 12.91 16.44 13.99 15.73L19.98 11.8C21.9 10.54 21.9 7.73 19.98 6.47L13.99 2.54C12.91 1.82 11.13 1.82 10.05 2.53Z"/><path d="M5.63 13.08L5.62 17.77C5.62 19.04 6.6 20.4 7.8 20.8L10.99 21.86C11.54 22.04 12.45 22.04 13.01 21.86L16.2 20.8C17.4 20.4 18.38 19.04 18.38 17.77V13.13M21.4 15V9"/></svg>
      </button>
      <button class="nav" id="openAnalysis" title="Справка СОР/СОЧ">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.47 19V5C21.47 3 20.47 2 18.47 2H14.47C12.47 2 11.47 3 11.47 5V19C11.47 21 12.47 22 14.47 22H18.47C20.47 22 21.47 21 21.47 19Z"/><path d="M11.47 6H16.47M11.47 18H15.47M11.47 13.95L16.47 14M11.47 10H14.47"/><path d="M5.49 2C3.86 2 2.53 3.33 2.53 4.95V17.91C2.53 18.36 2.72 19.04 2.95 19.43L3.77 20.79C4.71 22.36 6.26 22.36 7.2 20.79L8.02 19.43C8.25 19.04 8.44 18.36 8.44 17.91V4.95C8.44 3.33 7.11 2 5.49 2Z"/><path d="M8.44 7H2.53"/></svg>
      </button>
      <button class="nav" id="navSettings" title="Настройки">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.11V14.88C3 17 3 17 5 18.35L10.5 21.53C11.33 22.01 12.68 22.01 13.5 21.53L19 18.35C21 17 21 17 21 14.89V9.11C21 7 21 7 19 5.65L13.5 2.47C12.68 1.99 11.33 1.99 10.5 2.47L5 5.65C3 7 3 7 3 9.11Z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </nav>

    <div class="main">
      <header class="top">
        <div>
          <h1 id="greet">Добрый день</h1>
          <div class="sub" id="todaySub"></div>
        </div>
        <div class="grow"></div>
        <button class="icon-btn" id="themeBtn" title="Тема"></button>
        <button class="icon-btn" id="showMini" title="Показать мини-окно">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12.02 2.91C8.71 2.91 6.02 5.6 6.02 8.91V11.8C6.02 12.41 5.76 13.34 5.45 13.86L4.3 15.77C3.59 16.95 4.08 18.26 5.38 18.7C9.69 20.14 14.34 20.14 18.65 18.7C19.86 18.3 20.39 16.87 19.73 15.77L18.58 13.86C18.28 13.34 18.02 12.41 18.02 11.8V8.91C18.02 5.61 15.32 2.91 12.02 2.91Z"/><path d="M15.02 19.06C15.02 20.71 13.67 22.06 12.02 22.06C11.2 22.06 10.44 21.72 9.9 21.18C9.36 20.64 9.02 19.88 9.02 19.06"/></svg>
        </button>
      </header>

      <div class="scroll" id="scroll">
        <div id="updateBanner" class="banner" hidden></div>

        <section id="viewHome" class="content">
          <div class="col-left">
            <h2 class="today-head">Сегодня</h2>
            <div class="tiles" id="tiles"></div>
            <div class="card week" id="weekCard">
              <div class="week-head">
                <h2>Неделя</h2>
                <div class="grow"></div>
                <button class="arrow" id="prevWeek" title="Прошлая неделя"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 7.5L10 12L14.5 16.5"/></svg></button>
                <span class="range" id="range"></span>
                <button class="arrow" id="nextWeek" title="Следующая неделя"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 7.5L14 12L9.5 16.5"/></svg></button>
              </div>
              <div class="small muted">Нажмите на урок, чтобы задать или изменить домашнее задание.</div>
              <div id="daysBox"></div>
              <div id="templateNote" class="small muted"></div>
            </div>
          </div>
          <aside class="col-right">
            <h2>Подключения</h2>
            <div class="card bc">
              <div class="mark" aria-hidden="true">B</div>
              <div class="info"><b>BilimClass</b><small id="bcStatus"></small></div>
              <div id="bcAction"></div>
            </div>
            <div class="stats" id="stats"></div>
          </aside>
        </section>

        <section id="viewSettings" class="content settings" hidden>
          <h2>Настройки</h2>
          <div class="grid">
            <div class="card">
              <h3>BilimClass</h3>
              <div id="bilimStatus" class="muted"></div>
              <div id="bilimMsg" class="error small"></div>
              <div class="row" id="bilimButtons"></div>
            </div>
            <div class="card">
              <h3>Нейросеть (ключ API)</h3>
              <div id="aiView"></div>
            </div>
            <div class="card toggles">
              <h3>Мини-окно, напоминания, запуск</h3>
              <label><input type="checkbox" id="reminders"> Напоминать за 5 минут до урока</label>
              <label><input type="checkbox" id="gradeAlerts"> Группа риска (пн) и контроль конца четверти</label>
              <label><input type="checkbox" id="onTop"> Мини-окно поверх всех окон</label>
              <label><input type="checkbox" id="autostart"> Запускать вместе с Windows</label>
              <div class="row"><button id="showMini2">Показать мини-окно</button><button id="testReminder">Пробное напоминание</button></div>
              <div class="row small muted"><span id="version"></span><button id="checkUpdate">Проверить обновления</button></div>
            </div>
          </div>
          <div class="small muted" id="credits"></div>
        </section>
      </div>
    </div>
  </div>
  <script src="../shared/logic.js"></script>
  <script src="main.js"></script>
</body>
</html>
