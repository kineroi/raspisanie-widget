plugins {
    id 'com.android.application'
}

android {
    namespace 'kz.nikolaevka.raspisanie'
    compileSdk 34

    defaultConfig {
        applicationId 'kz.nikolaevka.raspisanie'
        minSdk 26
        targetSdk 34
        // Номер версии = номер сборки на GitHub (растёт с каждой сборкой).
        // По нему приложение понимает, что вышло обновление.
        def run = (System.getenv('GITHUB_RUN_NUMBER') ?: '3') as int
        versionCode run
        versionName "3.0.${run}"
    }

    // Постоянный ключ подписи: благодаря ему новые версии
    // устанавливаются поверх старых без удаления виджета.
    signingConfigs {
        debug {
            storeFile file('raspisanie.jks')
            storePassword 'raspisanie'
            keyAlias 'raspisanie'
            keyPassword 'raspisanie'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
